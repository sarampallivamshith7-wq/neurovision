[pytest]
pythonpath = .
testpaths = tests
markers =
    slow: end-to-end training tests (~10-30 s each); deselect with -m "not slow"
    data: requires the real THINGS-EEG2 data under data/ (auto-skipped when absent)
    network: requires downloading pretrained weights (auto-skipped when unavailable)
filterwarnings =
    ignore::FutureWarning
    ignore::DeprecationWarning
    ignore:.*montage.*:RuntimeWarning
